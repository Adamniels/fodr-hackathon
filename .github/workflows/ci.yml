name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Well above a normal run (under 40 s), so a hang fails fast instead of using the 6 hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The agent scripts' offline tests (fake gh, no GitHub calls), so a broken script fails the PR (#64).
      - run: npm run test:scripts

  e2e:
    runs-on: ubuntu-latest
    # A normal run takes about 10 minutes, most of it the tests. The job's limit leaves room for a slow package
    # mirror (#146: the browser's system packages once took 8 minutes), so slowness makes a slow job, not a cancelled
    # one; the steps that wait on the network or run long have limits of their own, so a hang fails at that step.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # The backing services from compose.yaml (ADR 0006), the same images and configuration as locally; M2's e2e
      # runs against them. Compose rather than service containers, which cannot pass the S3 store's start command.
      # Started first so the image pulls overlap the installs, then waited for.
      - run: docker compose up -d
        timeout-minutes: 5
      - run: npm ci
        timeout-minutes: 10
      # The browser itself is cached by the Playwright version it belongs to; its system packages still come from apt,
      # whose mirror is the step's slow part when it is slow (#146).
      - id: playwright
        # Fails the step rather than leaving an empty key, which would never change with an upgrade.
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15
      - run: docker compose up --wait --wait-timeout 180
      - run: bash scripts/dev/check-services.sh
      # The API against the Compose Postgres (#19); the tests create and migrate their own database.
      - run: npm run test:integration
        timeout-minutes: 5
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - run: npm run test:e2e
        timeout-minutes: 15
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    # Well above a normal run (about 2 minutes).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t fodr .
      # The Compose Postgres (same image and settings as locally), reached by service name on the Compose network.
      - run: docker compose up --wait --wait-timeout 120 postgres
      # The image's migrator, as a release runs it (ADR 0008); twice, since a run with nothing pending must pass too.
      - run: |
          for run in 1 2; do
            docker run --rm --network fodr_default -e DATABASE_URL=postgres://fodr:fodr@postgres:5432/fodr fodr \
              node apps/api/dist/migrate.mjs
          done
      # The image's product import (#35), as a release runs it after migrating; twice, since a re-run must change nothing.
      # The API refuses to start without it.
      - run: |
          for run in 1 2; do
            docker run --rm --network fodr_default -e DATABASE_URL=postgres://fodr:fodr@postgres:5432/fodr fodr \
              node apps/api/dist/import-products.mjs
          done
      # The production image serves the API and the web app on one origin (ADR 0005). No mail is sent and no file
      # stored in the smoke test, so SMTP and the file store point nowhere.
      - run: >-
          docker run -d --name fodr --network fodr_default -p 127.0.0.1:3000:3000
          -e DATABASE_URL=postgres://fodr:fodr@postgres:5432/fodr
          -e BETTER_AUTH_SECRET=ci-only-secret-of-at-least-32-characters -e BETTER_AUTH_URL=http://127.0.0.1:3000
          -e SMTP_HOST=127.0.0.1 -e SMTP_PORT=1025 -e "MAIL_FROM=Fodr <no-reply@fodr.test>"
          -e S3_ENDPOINT=http://127.0.0.1:1 -e S3_BUCKET=fodr -e S3_ACCESS_KEY_ID=ci -e S3_SECRET_ACCESS_KEY=ci-only
          -e AI_PRICE_SEK_PER_MTOK_INPUT=0 -e AI_PRICE_SEK_PER_MTOK_OUTPUT=0 fodr
      - name: Smoke test the image
        run: |
          for i in $(seq 30); do curl -sf http://127.0.0.1:3000/api/v1/health >/dev/null && break; sleep 1; done
          curl -sfi http://127.0.0.1:3000/api/v1/health | grep -i '^x-request-id: '
          curl -sf http://127.0.0.1:3000/horses/1 | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:3000/api/v1/products | grep -q '"products":\[{'
          curl -s -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:3000/api/v1/nope \
            | grep -x '404 application/problem+json'
          # Auth in the bundle against the migrated database: no session is a problem+json 401 (#22).
          curl -s -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:3000/api/v1/me \
            | grep -x '401 application/problem+json'
          curl -sf http://127.0.0.1:3000/api/auth/ok | grep -q '"ok":true'
      - if: failure()
        run: docker logs fodr; docker compose logs --no-color postgres

  # Whether a PR changes what the extraction eval checks (#34): scripts/ci/eval-needed.sh reads the files the PR changes,
  # from the merge commit against its first parent (the base it is merged into). A plain git diff, so no third-party
  # action decides what runs. Dependabot's PRs get no secrets and only bump versions, so they skip the eval (owner, #34).
  ai-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eval: ${{ steps.diff.outputs.eval }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        # bash with pipefail: a failing git diff must fail the job, not read as "nothing changed".
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git diff --name-only HEAD^1 HEAD > changed.txt
          cat changed.txt
          if [ "$ACTOR" = 'dependabot[bot]' ]; then
            needed=false
            echo "Dependabot PR: the extraction eval is skipped (no secrets, only version bumps)." >> "$GITHUB_STEP_SUMMARY"
          else
            needed=$(bash scripts/ci/eval-needed.sh < changed.txt)
          fi
          echo "eval=$needed" >> "$GITHUB_OUTPUT"

  # The extraction eval (#34): the report reading of every test report against the answer key, with the real model
  # (about 11 calls). It fails on an invented value, the reference report read as an analysis, a failed call, or too
  # few values right (apps/api/src/ai/eval.ts), and the job summary shows each file. Skipped when nothing it checks
  # changed; a skipped job passes, so it can be a required check (docs/operations.md). If the change detection itself
  # failed, the eval runs rather than being skipped, so a broken detection cannot let a change through.
  eval:
    needs: ai-changes
    if: >-
      always() && needs.ai-changes.result != 'skipped' && needs.ai-changes.result != 'cancelled' &&
      (needs.ai-changes.result != 'success' || needs.ai-changes.outputs.eval == 'true')
    runs-on: ubuntu-latest
    # A run takes about a minute; the calls have a limit of their own, so a hang fails fast.
    timeout-minutes: 15
    steps:
      - name: Require the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            msg='The ANTHROPIC_API_KEY secret is not available, so the eval cannot run: set it under Settings > Secrets and variables > Actions (a PR from a fork gets no secrets).'
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run eval:analysis -w apps/api
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The model the API is deployed with, when set as a repository variable; otherwise the code's default.
          AI_MODEL: ${{ vars.AI_MODEL }}
