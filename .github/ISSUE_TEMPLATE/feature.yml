name: Feature
description: Something new or changed. Describe the need, not the implementation.
title: "feature: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        A ticket fixes **what** and **why**. **How** is decided when the ticket is picked up, so leave the solution out. Anything undecided goes under Open questions.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Who needs what, and why. The problem it solves.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behaviour that proves it is done, as a checklist.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is explicitly out.
  - type: textarea
    id: constraints
    attributes:
      label: Fixed constraints
      description: Only what is already decided, with a link (spec, ADR, owner). Everything else goes under Open questions.
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Decisions to make with the owner when the ticket is picked up.
  - type: textarea
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be closed before this one can start, one "- #N" line each. Leave empty if none; scripts/agent/next.sh reads this section.
      placeholder: "- #12"
