# Backing services for local development and CI (ADR 0006). The API and the web app run on the host with
# `npm run dev`. Values come from `.env` (copy `.env.example`); the defaults below are for development only.
# Image tags are pinned to the newest release at least two weeks old (docs/architecture.md). Ports are bound to
# 127.0.0.1, so nothing is reachable from the network.
name: fodr

services:
  postgres:
    # The major follows production (ADR 0006). ICU Swedish collation, so names with å, ä and ö sort as in Swedish;
    # production uses the same (#18, #45). Initdb options only apply to a new volume.
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fodr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fodr}
      POSTGRES_DB: ${POSTGRES_DB:-fodr}
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=sv-SE
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during first start the temporary init server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  s3:
    # SeaweedFS stands in for MinIO, whose images can no longer be pulled (ADR 0006, ADR 0011); the app only
    # speaks the S3 API, so any S3 compatible store works. The S3 identity is written from the .env values. Each bucket
    # is a collection with volumes of its own (7 when it is first written), so the default of 8 volumes would hold one
    # bucket: 64 small, sparse volumes leave room for the dev, integration and e2e buckets (#26).
    image: chrislusf/seaweedfs:4.51
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-fodr}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-fodr-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"fodr","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -volume.max=64 -master.volumeSizeLimitMB=256
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  mailpit:
    # Catches outgoing email; web inbox on MAILPIT_UI_PORT, http://localhost:8025 by default (ADR 0006, ADR 0009).
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  s3-data:
