# Backing services for local development and CI (ADR 0006). The API and the web app run on the host with
# `npm run dev`. Values come from `.env` (copy `.env.example`); the defaults below are for development only.
# Image tags are pinned to the newest release at least two weeks old (docs/architecture.md).
name: fodr

services:
  postgres:
    # Debian based, so text sorts like glibc and ICU hosts (Swedish names); the major follows production (ADR 0006).
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fodr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fodr}
      POSTGRES_DB: ${POSTGRES_DB:-fodr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  s3:
    # SeaweedFS stands in for MinIO, whose images can no longer be pulled (ADR 0006, ADR 0011); the app only
    # speaks the S3 API, so any S3 compatible store works. The S3 identity is written from the .env values.
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-fodr}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-fodr-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"fodr","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  mailpit:
    # Catches outgoing email; inbox at http://localhost:8025 (ADR 0006, ADR 0009).
    image: axllent/mailpit:v1.31.4
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  s3-data:
