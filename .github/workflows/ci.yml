name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Well above a normal run (under 40 s), so a hang fails fast instead of using the 6 hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The agent scripts' offline tests (fake gh, no GitHub calls), so a broken script fails the PR (#64).
      - run: npm run test:scripts

  e2e:
    runs-on: ubuntu-latest
    # Well above a normal run (under 100 s).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # The backing services from compose.yaml (ADR 0006), the same images and configuration as locally; M2's e2e
      # runs against them. Compose rather than service containers, which cannot pass the S3 store's start command.
      # Started first so the image pulls overlap the installs, then waited for.
      - run: docker compose up -d
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --wait --wait-timeout 180
      - run: bash scripts/dev/check-services.sh
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
