name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Well above a normal run (under 40 s), so a hang fails fast instead of using the 6 hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The agent scripts' offline tests (fake gh, no GitHub calls), so a broken script fails the PR (#64).
      - run: npm run test:scripts

  e2e:
    runs-on: ubuntu-latest
    # Well above a normal run (under 100 s).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # The backing services from compose.yaml (ADR 0006), the same images and configuration as locally; M2's e2e
      # runs against them. Compose rather than service containers, which cannot pass the S3 store's start command.
      # Started first so the image pulls overlap the installs, then waited for.
      - run: docker compose up -d
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --wait --wait-timeout 180
      - run: bash scripts/dev/check-services.sh
      # The API against the Compose Postgres (#19); the tests create and migrate their own database.
      - run: npm run test:integration
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    # Well above a normal run (about 2 minutes).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fodr .
      # The production image serves the API and the web app on one origin (ADR 0005). The API does not connect to
      # the database yet, so DATABASE_URL only has to be valid.
      - run: docker run -d --name fodr -p 127.0.0.1:3000:3000 -e DATABASE_URL=postgres://fodr:fodr@db:5432/fodr fodr
      - name: Smoke test the image
        run: |
          for i in $(seq 30); do curl -sf http://127.0.0.1:3000/api/v1/health >/dev/null && break; sleep 1; done
          curl -sfi http://127.0.0.1:3000/api/v1/health | grep -i '^x-request-id: '
          curl -sf http://127.0.0.1:3000/horses/1 | grep -q '<div id="root">'
          curl -s -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:3000/api/v1/nope \
            | grep -x '404 application/problem+json'
      - if: failure()
        run: docker logs fodr
