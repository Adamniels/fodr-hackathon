# Dependabot version updates. Security updates are a separate repository setting
# (Dependabot security updates, which needs alerts on) and are not subject to the
# cooldown below, so security fixes arrive promptly (ADR 0009).
#
# The 14 day cooldown implements the rule in docs/architecture.md: only adopt a
# release once it is at least two weeks old.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Majors are left out of the group so each gets its own PR and review.
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @types/node majors follow the Node version in .nvmrc, so they are bumped by hand together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is postponed (#61): typescript-eslint does not support it yet, and fodr/no-raw-number-text
      # uses the TypeScript compiler API that TS 7 does not provide in that form. Remove this rule once
      # typescript-eslint supports TS 7. TS 6 is not held back.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
